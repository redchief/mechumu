# The extension connector's I2S sound card (mechumu's "Comet SAI2" USB audio device, there only
# while an I2S extension is attached): named for what it is rather than its pid.codes test ID, and
# ranked below the Comet's own speaker and mic, so attaching an extension doesn't silence them.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-mechumu_Comet_SAI2.*" } ]
    actions = { update-props = { device.description = "Comet SAI2 (extension I2S)" } }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-mechumu_Comet_SAI2.*" } ]
    actions = { update-props = { node.description = "Comet SAI2 (extension I2S) output", priority.driver = 900, priority.session = 900 } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-mechumu_Comet_SAI2.*" } ]
    actions = { update-props = { node.description = "Comet SAI2 (extension I2S) input", priority.driver = 1900, priority.session = 1900 } }
  }
]
