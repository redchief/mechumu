# The Comet's buttons are gpio-keys at fixed /dev/input/eventN paths; in the Virtual Comet they are
# comet-simd's simulated devices (see 70-comet-sim.rules).
[Unit]
Wants=comet-simd.service
After=comet-simd.service

[Service]
Environment=POWER_BUTTON_PATH=/dev/input/comet-power HOME_BUTTON_PATH=/dev/input/comet-home
Environment=VOLUME_UP_BUTTON_PATH=/dev/input/comet-volup VOLUME_DOWN_BUTTON_PATH=/dev/input/comet-voldown
Environment=EXTENSION_PATH=/dev/input/comet-extension
