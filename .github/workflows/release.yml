name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, smoke test & publish release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/mechumu
          key: mechumu-cache-${{ hashFiles('build/build.sh', 'patches/**') }}
          restore-keys: |
            mechumu-cache-

      - name: Build Virtual Comet image
        run: |
          mkdir -p out "${{ github.workspace }}/.cache/mechumu"
          docker run --rm --privileged \
            -v "${{ github.workspace }}":/mechumu \
            -v "${{ github.workspace }}/.cache/mechumu":/var/cache/mechumu \
            -e MECHUMU_REV="${GITHUB_SHA::7}" \
            fedora:44 /mechumu/build/build.sh /mechumu/out

      - name: Install QEMU & UEFI firmware
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm qemu-utils qemu-efi-aarch64 xxd

      - name: Run end-to-end smoke test
        run: ./tests/smoke.sh

      - name: Package release assets
        run: |
          mkdir -p dist
          cp out/mechanix-os-virt.qcow2 dist/
          tar -C out -czf dist/evk-boot.tar.gz evk-boot
          (cd dist && sha256sum mechanix-os-virt.qcow2 evk-boot.tar.gz > SHA256SUMS)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/mechanix-os-virt.qcow2
            dist/evk-boot.tar.gz
            dist/SHA256SUMS
