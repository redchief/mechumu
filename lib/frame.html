<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual Comet</title>
<style>
  :root {
    --bg: #101011; --panel: #1b1b1d; --line: #2e2e31; --text: #e8e6e3; --dim: #8d8a86;
    --body: #3a3a3d; --edge: #3a3a3d; --key: #0f0f10; --key-text: #f2f2f2;
    --accent: #e07b10; --pogo: #c9a14a; --pad: #e3bf73; --breakout: #e2554a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  main { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; align-items: flex-start; padding: 24px 16px; }

  /* The Comet: screen module on top, a home pill, the extension below; buttons on the edges. */
  /* The device turns inside the stage, which takes the turned device's size. */
  .stage { position: relative; flex: none; }
  .device { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(var(--rot, 0deg)); transition: transform .3s;
            width: min(400px, calc(100vw - 32px)); padding: 10px 10px 14px; border-radius: 26px;
            background: linear-gradient(180deg, #4a4a4d, var(--body) 40%); box-shadow: 0 1px 0 #5a5a5e inset, 0 24px 48px rgba(0,0,0,.5); }
  .screen { aspect-ratio: 1080 / 1240; background: #000; border-radius: 18px; overflow: hidden; position: relative;
            border: 9px solid #0b0b0c; box-shadow: 0 0 0 1px #000; }
  #vnc { position: absolute; inset: 0; touch-action: none; }
  .screen .hint { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; color: var(--dim); text-align: center; padding: 24px;
                  background: rgba(0,0,0,.6); }
  .screen .hint[hidden] { display: none; }
  .hw { position: absolute; background: #333336; border: 0; border-radius: 3px; cursor: pointer; padding: 0; }
  .hw:hover { background: var(--accent); }
  .hw:active { transform: scale(.94); }
  .hw.power { right: -5px; top: 70px; width: 5px; height: 46px; }
  .hw.volup { left: -5px; top: 70px; width: 5px; height: 40px; }
  .hw.voldown { left: -5px; top: 116px; width: 5px; height: 40px; }
  .home { display: block; margin: 14px auto 0; width: 64px; height: 16px; border-radius: 8px; border: 0; cursor: pointer;
          background: #141415; box-shadow: 0 2px 3px rgba(0,0,0,.7) inset, 0 1px 0 #5a5a5e; }
  .home:hover { box-shadow: 0 2px 3px rgba(0,0,0,.7) inset, 0 0 0 1px var(--accent); }
  .bay { position: relative; margin-top: 14px; border-radius: 18px; min-height: 120px; }
  /* Gamepad and breakout cards: a folder-tab top edge, the right part a step lower. */
  .bay.folder { margin-top: 10px; padding-top: 26px; }
  .bay.folder::before { content: ""; position: absolute; right: -1px; top: -1px; width: 42%; height: 13px; background: var(--body);
                        clip-path: polygon(0 0, 100% 0, 100% 100%, 13px 100%); }

  /* Nothing attached: the bare lower half, the 40 pogo pins along its top. */
  .pogo { background: linear-gradient(180deg, #3c3c3f, #353538); box-shadow: 0 1px 0 #555559 inset; display: grid; place-items: start center;
          padding: 14px 12px; aspect-ratio: 362 / 285; }
  .pins { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; width: 70%; padding: 6px 8px; background: #0c0c0d; border-radius: 6px; }
  .pins i { aspect-ratio: 1; border-radius: 50%; background: var(--pogo); }

  /* Keyboard extension */
  .kbd { background: linear-gradient(180deg, #4b4b4e, #3e3e41); box-shadow: 0 1px 0 #616165 inset, 0 6px 14px rgba(0,0,0,.45);
         padding: 12px 10px 14px; display: grid; gap: 6px; }
  .kbd .row { display: flex; gap: 5px; }
  .k { position: relative; flex: 1 1 0; min-width: 0; height: 40px; border: 0; border-radius: 6px; background: var(--key); color: var(--key-text);
       font: 600 13px system-ui; cursor: pointer; padding: 0; box-shadow: 0 1px 0 rgba(255,255,255,.07) inset, 0 2px 0 #000; }
  .k sup, .k sub { position: absolute; font: 500 8px/1 system-ui; color: #b9b9bd; }
  .k sup { left: 4px; top: 3px; }
  .k sub { right: 4px; bottom: 3px; border: 1px solid #77777c; border-radius: 2px; padding: 0 2px; }
  .k sub.arrow { border: 0; left: 4px; right: auto; color: #e8e8ea; }
  .k.wide { flex-grow: 1.6; } .k.space { flex-grow: 3.6; }
  .k:active, .k.down { background: var(--accent); color: #000; }
  .k.sticky { outline: 2px solid var(--accent); }
  .k.off { color: #9a9aa0; cursor: not-allowed; }
  .k.small { font-size: 11px; }
  .kbd .top { display: flex; justify-content: space-between; align-items: center; padding: 2px 10px 8px; }
  .kbd .top i { height: 22px; border-radius: 11px; background: #161617; box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 2px 0 #000; }
  .kbd .top i.sq { width: 26px; border-radius: 8px; } .kbd .top i.pill { width: 50px; } .kbd .top i.btn { width: 26px; height: 26px; border-radius: 50%; }
  .kbd .top i.grille { width: 44px; height: 44px; border-radius: 50%;
                       background: radial-gradient(circle, #2b2b2d 1px, transparent 1.4px) 0 0 / 5px 5px, #121213; }
  .kbd .left { display: flex; gap: 8px; } .kbd .right { display: flex; gap: 8px; align-items: center; }

  /* Gamepad extension */
  .pad { background: linear-gradient(180deg, #e9c87e, var(--pad)); box-shadow: 0 1px 0 #f4dfa8 inset, 0 6px 14px rgba(0,0,0,.45);
         padding: 22px 18px 18px; display: grid; grid-template-columns: 1fr auto 1fr; grid-template-areas: "stick mid abxy" "star dpad round";
         gap: 10px 8px; align-items: center; color: #111; }
  .stick { grid-area: stick; width: 92px; height: 92px; border-radius: 50%; position: relative; touch-action: none; cursor: grab; justify-self: center;
           background: radial-gradient(circle, #1b1b1b 0 52%, #c9a14f 54%, #e3bf73 66%, transparent 67%); }
  .stick b { position: absolute; width: 50px; height: 50px; left: 21px; top: 21px; border-radius: 50%; pointer-events: none;
             background: radial-gradient(circle at 40% 35%, #3a3a3a, #0d0d0d 70%); }
  .abxy { grid-area: abxy; position: relative; width: 104px; height: 104px; justify-self: center; }
  .abxy button, .dpad button, .pad .small, .pad .round { position: absolute; border: 0; background: #151515; color: #f0f0f0; font: 600 15px system-ui;
       cursor: pointer; box-shadow: 0 2px 0 #000, 0 1px 0 rgba(255,255,255,.1) inset; }
  .abxy button { width: 34px; height: 34px; border-radius: 50%; }
  .abxy [data-b=y] { left: 35px; top: 0; } .abxy [data-b=x] { left: 0; top: 35px; }
  .abxy [data-b=b] { left: 70px; top: 35px; } .abxy [data-b=a] { left: 35px; top: 70px; }
  .dpad { grid-area: dpad; position: relative; width: 96px; height: 96px; justify-self: center; }
  .dpad::before { content: ""; position: absolute; left: 32px; top: 32px; width: 32px; height: 32px; background: #151515; }
  .dpad button { width: 32px; height: 32px; border-radius: 0; box-shadow: none; }
  .dpad [data-d=up] { left: 32px; top: 0; border-radius: 6px 6px 0 0; } .dpad [data-d=left] { left: 0; top: 32px; border-radius: 6px 0 0 6px; }
  .dpad [data-d=right] { left: 64px; top: 32px; border-radius: 0 6px 6px 0; } .dpad [data-d=down] { left: 32px; top: 64px; border-radius: 0 0 6px 6px; }
  .pad .mid { grid-area: mid; display: flex; gap: 8px; justify-content: center; align-self: start; margin-top: 8px; }
  .pad .small, .pad .round { position: static; }
  .pad .small { width: 30px; height: 11px; border-radius: 6px; transform: rotate(-35deg); }
  .pad .round { width: 38px; height: 38px; border-radius: 50%; justify-self: center; }
  .pad .round.star { grid-area: star; width: 26px; height: 26px; font-size: 13px; justify-self: start; margin-left: 12px; align-self: end; }
  .pad .round.thumb { grid-area: round; }
  .pad button:active, .pad button.down { background: var(--accent); color: #000; }

  /* IO breakout extension */
  .breakout { background: linear-gradient(180deg, #e4625a, var(--breakout)); box-shadow: 0 1px 0 #f08a83 inset, 0 6px 14px rgba(0,0,0,.45);
              padding: 26px 22px 22px; color: #fff; aspect-ratio: 362 / 285; display: flex; flex-direction: column; }
  .breakout .slots { display: flex; gap: 6px; margin-left: 18px; }
  .breakout .slots i { width: 30px; height: 9px; border-radius: 5px; background: #2a1514; box-shadow: 0 1px 0 rgba(255,255,255,.25); }
  .breakout .leds { position: absolute; right: 44px; top: 22px; display: flex; gap: 5px; }
  .breakout .leds i { width: 4px; height: 4px; border-radius: 50%; background: #b8443d; }
  .breakout .screw { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #151515; box-shadow: 0 0 0 2px #b8443d; }
  .header { margin: auto auto 4px; width: 80%; display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; background: #222; padding: 4px; border-radius: 3px;
            box-shadow: 0 0 0 2px #2b2b2b; }
  .header span { aspect-ratio: 1; background: #0d0d0d; border: 2px solid #4a4a4a; cursor: help; }
  .header span.sim { border-color: var(--pad); }
  .note code { background: rgba(255,255,255,.08); padding: 1px 4px; border-radius: 3px; }

  .custom { background: #303033; border: 1px solid var(--edge); padding: 16px; }
  .custom form { display: flex; gap: 6px; margin-top: 8px; }

  /* Side panel */
  .panel { width: min(340px, calc(100vw - 32px)); display: grid; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .choices { display: flex; flex-wrap: wrap; gap: 6px; }
  .choices button, .panel button, .custom button { background: #26262a; color: var(--text); border: 1px solid var(--line);
       border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
  .choices button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  input, select { background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; min-width: 0; }
  .row2 { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .row2 input[type=range] { flex: 1; }
  #log { font: 12px ui-monospace, monospace; color: var(--dim); white-space: pre-wrap; max-height: 140px; overflow: auto; margin: 0; }
  .note { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
  <div class="device" id="device" aria-label="Virtual Comet">
    <button class="hw power" data-btn="power" title="Power" aria-label="Power button"></button>
    <button class="hw volup" data-btn="volup" title="Volume up" aria-label="Volume up"></button>
    <button class="hw voldown" data-btn="voldown" title="Volume down" aria-label="Volume down"></button>
    <div class="screen"><div class="hint" id="hint">Connecting to the screen…</div><div id="vnc"></div></div>
    <button class="home" data-btn="home" title="Home" aria-label="Home button"></button>
    <div class="bay" id="bay"></div>
  </div>
  </div>

  <div class="panel">
    <section>
      <h2>Screen</h2>
      <div class="choices" id="tools">
        <button id="shot" title="Save a screenshot">Screenshot</button>
        <button id="rec" title="Record the screen" aria-pressed="false">Record</button>
        <button data-turn="-90" title="Turn the device left" aria-label="Turn left">⟲</button>
        <button data-turn="90" title="Turn the device right" aria-label="Turn right">⟳</button>
        <button id="save" title="Save the device and quit; the next mechumu run resumes it">Save &amp; quit</button>
      </div>
      <p class="note">A touchscreen: click or drag for one finger, Ctrl-drag to pinch, scroll to swipe.</p>
    </section>
    <section>
      <h2>Extension</h2>
      <div class="choices" id="choices">
        <button data-ext="">None</button>
        <button data-ext="keyboard">Keyboard</button>
        <button data-ext="gamepad">Gamepad</button>
        <button data-ext="io-breakout">IO Breakout</button>
      </div>
      <form class="row2" id="custom-form">
        <input id="custom-path" placeholder="/path/to/your_extension.py" aria-label="Path to your extension model">
        <button>Attach</button>
      </form>
      <p class="note" id="ext-note"></p>
    </section>
    <section>
      <h2>Battery</h2>
      <div class="row2">
        <input type="range" id="bat" min="0" max="100" value="80" aria-label="Battery level">
        <span id="bat-v">80%</span>
        <select id="bat-s" aria-label="Battery state"><option>discharging</option><option>charging</option><option>full</option></select>
      </div>
    </section>
    <section>
      <h2>Sensors</h2>
      <div class="row2">
        <label for="lux">Light</label>
        <input type="range" id="lux" min="0" max="4" step="0.01" value="2.48" aria-label="Ambient light">
        <span id="lux-v">300 lux</span>
      </div>
      <div class="choices" id="poses" style="margin-top:8px">
        <button data-tilt="90 0" data-rot="0">Upright</button>
        <button data-tilt="0 0" data-rot="0">Flat</button>
        <button data-tilt="-90 0" data-rot="180">Upside down</button>
        <button data-tilt="0 -90" data-rot="270">Landscape ⟲</button>
        <button data-tilt="0 90" data-rot="90">Landscape ⟳</button>
      </div>
      <div class="row2">
        <label for="heading">Heading</label>
        <input type="range" id="heading" min="0" max="359" value="0" aria-label="Compass heading">
        <span id="heading-v">0° N</span>
      </div>
    </section>
    <section>
      <h2>Activity</h2>
      <pre id="log"></pre>
    </section>
  </div>
</main>

<script type="module">
import RFB from "/novnc/core/rfb.js";  // vendored in lib/novnc, served by the hub

const $ = (s, el = document) => el.querySelector(s);
const log = (line) => { const l = $("#log"); l.textContent = (line + "\n" + l.textContent).slice(0, 4000); };

async function cmd(line, quiet) {
  const r = await fetch("/cmd", { method: "POST", headers: { "X-Mechumu": "1" }, body: line });
  const text = await r.text();
  if (!quiet || !text.startsWith("ok")) log(`${line} → ${text}`);
  return text;
}

// --- screen ------------------------------------------------------------------------------------
function connect() {
  const rfb = new RFB($("#vnc"), `ws://${location.host}/vnc`);
  rfb.scaleViewport = true;
  rfb.focusOnClick = false;  // the Comet has no keyboard of its own: keys go to the keyboard extension
  rfb.viewOnly = true;  // and no mouse: the screen takes touches (below)
  rfb.addEventListener("connect", () => { $("#hint").hidden = true; });
  rfb.addEventListener("disconnect", () => {
    $("#hint").hidden = false;
    if (saved) return void ($("#hint").textContent = "Saved. 'mechumu run' resumes here.");
    $("#hint").textContent = "Screen disconnected; retrying…";
    setTimeout(connect, 2000);
  });
}
connect();

// --- toolbar: screenshot, recording, turning the device, save & quit (Quick Boot) ---------------
const stamp = () => new Date().toISOString().slice(0, 19).replace(/[-:]/g, "").replace("T", "-");
const save = (blob, name) => { const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name }); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 10000); };
$("#shot").addEventListener("click", async () => {
  const r = await fetch("/screenshot", { headers: { "X-Mechumu": "1" } });
  if (!r.ok) return log(`screenshot → error ${r.status}`);
  save(await r.blob(), `comet-${stamp()}.png`);
  log("screenshot saved");
});
let recorder = null;
$("#rec").addEventListener("click", () => {
  if (recorder) return recorder.stop();
  const canvas = $("canvas", screenEl);
  const type = ["video/mp4", "video/webm"].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!canvas || !type) return log("record → this browser can't record the screen");
  const parts = [];
  recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: type });
  recorder.ondataavailable = (e) => parts.push(e.data);
  recorder.onstop = () => {
    save(new Blob(parts, { type }), `comet-${stamp()}.${type.split("/")[1]}`);
    recorder = null;
    $("#rec").textContent = "Record"; $("#rec").setAttribute("aria-pressed", "false");
    log("recording saved");
  };
  recorder.start();
  $("#rec").textContent = "Stop recording"; $("#rec").setAttribute("aria-pressed", "true");
});
// Turning the device turns the frame and tells the IMU, as turning a real Comet would.
let rot = 0;
const POSE = { 0: "90 0", 90: "0 90", 180: "-90 0", 270: "0 -90" };
const stage = $("#stage"), device = $("#device");
function fitStage() {
  const w = device.offsetWidth, h = device.offsetHeight, side = rot % 180;
  stage.style.width = `${side ? h : w}px`; stage.style.height = `${side ? w : h}px`;
}
function turnTo(r) { rot = ((r % 360) + 360) % 360; device.style.setProperty("--rot", `${rot}deg`); fitStage(); }
fitStage();  // now, not just on the first resize report: the stage starts with no size
new ResizeObserver(fitStage).observe(device);
$("#tools").addEventListener("click", (e) => {
  const b = e.target.closest("[data-turn]");
  if (b) { turnTo(rot + +b.dataset.turn); cmd(`ctl tilt ${POSE[rot]}`); }
});
let saved = false;
$("#save").addEventListener("click", async () => {
  $("#hint").hidden = false; $("#hint").textContent = "Saving…";
  const r = await cmd("stop");
  saved = r.startsWith("ok");
  $("#hint").textContent = saved ? "Saved. 'mechumu run' resumes here." : r;
});

// --- touch: the screen is a touchscreen, as on the Comet ----------------------------------------
// A click-drag is one finger; Ctrl-drag is a pinch, the second finger mirrored about the screen's
// centre (as in Android's emulator); the wheel swipes; a real touchscreen's fingers each get a slot.
let touchWs;
(function touchSocket() { touchWs = new WebSocket(`ws://${location.host}/touch`); touchWs.onclose = () => setTimeout(touchSocket, 2000); })();
const touch = (m) => touchWs.readyState === 1 && touchWs.send(m);
const screenEl = $("#vnc");
const fingers = new Map();  // pointerId -> its slots
// The screen's on-page box, turned with the device: map back to the panel's own x, y.
const where = (e) => {
  const r = ($("canvas", screenEl) || screenEl).getBoundingClientRect(), u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
  return [...{ 0: [u, v], 90: [v, 1 - u], 180: [1 - u, 1 - v], 270: [1 - v, u] }[rot], r];
};
const freeSlot = () => { const used = [...fingers.values()].flat(); for (let s = 0; s < 7; s++) if (!used.includes(s)) return s; };
const mirror = (i, x, y) => (i ? [1 - x, 1 - y] : [x, y]).join(" ");
screenEl.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  const [x, y] = where(e), slots = [freeSlot()];
  if (slots[0] === undefined) return;
  screenEl.setPointerCapture(e.pointerId);
  fingers.set(e.pointerId, slots);
  if (e.ctrlKey && e.pointerType === "mouse") slots.push(freeSlot());
  slots.forEach((s, i) => touch(`down ${s} ${mirror(i, x, y)}`));
});
screenEl.addEventListener("pointermove", (e) => {
  const slots = fingers.get(e.pointerId);
  if (!slots) return;
  const [x, y] = where(e);
  slots.forEach((s, i) => touch(`move ${s} ${mirror(i, x, y)}`));
});
const lift = (e) => { (fingers.get(e.pointerId) || []).forEach((s) => touch(`up ${s}`)); fingers.delete(e.pointerId); };
screenEl.addEventListener("pointerup", lift);
screenEl.addEventListener("pointercancel", lift);
let wheeling = false;
screenEl.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (wheeling || fingers.size) return;
  wheeling = true;
  const [x, y, r] = where(e), clamp = (v) => Math.max(-0.25, Math.min(0.25, v));
  const dx = clamp(-e.deltaX / r.width), dy = clamp(-e.deltaY / r.height);
  touch(`down 7 ${x} ${y}`);
  for (let i = 1; i <= 4; i++) setTimeout(() => touch(`move 7 ${x + dx * i / 4} ${y + dy * i / 4}`), i * 16);
  setTimeout(() => { touch("up 7"); wheeling = false; }, 90);
}, { passive: false });

// --- hardware buttons --------------------------------------------------------------------------
document.querySelectorAll("[data-btn]").forEach((b) => b.addEventListener("click", () => cmd(`ctl button ${b.dataset.btn}`)));

// --- battery -----------------------------------------------------------------------------------
const bat = () => { $("#bat-v").textContent = `${$("#bat").value}%`; cmd(`ctl battery ${$("#bat").value} ${$("#bat-s").value}`, true); };
$("#bat").addEventListener("change", bat);
$("#bat").addEventListener("input", () => { $("#bat-v").textContent = `${$("#bat").value}%`; });
$("#bat-s").addEventListener("change", bat);

// --- onboard sensors: light (log scale, 1-10000 lux), pose, compass heading ----------------------
const luxOf = () => Math.round(10 ** +$("#lux").value) - ($("#lux").value === "0" ? 1 : 0);
$("#lux").addEventListener("input", () => { $("#lux-v").textContent = `${luxOf()} lux`; });
$("#lux").addEventListener("change", () => cmd(`ctl light ${luxOf()}`, true));
$("#poses").addEventListener("click", (e) => { const b = e.target.closest("[data-tilt]"); if (b) { cmd(`ctl tilt ${b.dataset.tilt}`); turnTo(+b.dataset.rot); } });
const compass = (d) => ["N", "NE", "E", "SE", "S", "SW", "W", "NW"][Math.round(d / 45) % 8];
$("#heading").addEventListener("input", () => { $("#heading-v").textContent = `${$("#heading").value}° ${compass(+$("#heading").value)}`; });
$("#heading").addEventListener("change", () => cmd(`ctl heading ${$("#heading").value}`, true));

// --- extensions --------------------------------------------------------------------------------
let attached = null;
async function attach(spec) {
  const r = await cmd(spec ? `attach ${spec}` : "detach");
  if (r.startsWith("ok")) await refresh();
}
$("#choices").addEventListener("click", (e) => { const b = e.target.closest("[data-ext]"); if (b) attach(b.dataset.ext); });
$("#custom-form").addEventListener("submit", (e) => { e.preventDefault(); const p = $("#custom-path").value.trim(); if (p) attach(p); });

async function refresh() {
  const r = await cmd("status", true);
  const m = r.match(/^ok (.+) attached$/);
  const name = m && m[1] !== "nothing" ? m[1] : null;
  if (name === attached && $("#bay").childElementCount) return;
  attached = name;
  $("#bay").replaceWith(Object.assign(document.createElement("div"), { id: "bay", className: "bay" }));  // drops the old extension's listeners
  document.querySelectorAll("#choices [data-ext]").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.ext || null) === name)));
  await (render[name] ? render[name]() : render.custom(name));
  fitStage();  // the device's size changed with its extension
}
setInterval(refresh, 2000);

const render = {
  null() {
    $("#bay").className = "bay pogo";
    $("#bay").innerHTML = `<div class="pins">${"<i></i>".repeat(40)}</div>`;
    $("#ext-note").textContent = "The 40-pin connector under the magnetic lid. Snap an extension on.";
  },
  keyboard: renderKeyboard,
  gamepad: renderGamepad,
  "io-breakout": renderBreakout,
  custom(name) {
    $("#bay").className = "bay custom";
    $("#bay").innerHTML = `<strong>${name}</strong><div class="note">Your extension model. Its commands:</div>
      <form><input placeholder="command, e.g. press 1" aria-label="Command for ${name}" style="flex:1"><button>Send</button></form>`;
    $("form", $("#bay")).addEventListener("submit", (e) => { e.preventDefault(); const i = $("input", e.target); if (i.value) cmd(i.value); i.value = ""; });
    $("#ext-note").textContent = "Edit the model, then attach it again to reload it.";
  },
};

// Keyboard: HID usages; modifiers are bits in the report's first byte.
const USAGE = { ...Object.fromEntries("abcdefghijklmnopqrstuvwxyz".split("").map((c, i) => [c, 4 + i])),
  ...Object.fromEntries("1234567890".split("").map((c, i) => [c, 30 + i])),
  enter: 40, esc: 41, del: 42, tab: 43, space: 44, "-": 45, "=": 46, "[": 47, "]": 48, "\\": 49, ";": 51, "'": 52, "`": 53,
  ",": 54, ".": 55, "/": 56, right: 79, left: 80, down: 81, up: 82 };
const MOD = { ctrl: 1, shift: 2, alt: 4, super: 8 };
const ROWS = [["q","w","e","r","t","y","u","i","o","p"], ["a","s","d","f","g","h","j","k","l","del"],
              ["shift","z","x","c","v","b","n","m","enter"], ["ctrl","fn",  "tab", ",", "space", ".", "alt", "fn", "123"]];
// The keycaps' second legends: symbols and digits are on the firmware's fn layers, which aren't modelled.
const SYM = Object.fromEntries("qwertyuiop".split("").map((c, i) => [c, "!@#$%^&*()"[i]]));
const DIGIT = Object.fromEntries("qwertyuiop".split("").map((c, i) => [c, "1234567890"[i]]));
const ARROW = { d: "▲", z: "◀", x: "▼", c: "▶" };
const kb = { mods: 0, keys: new Set(), sticky: 0 };
const sendKeys = () => cmd(`report ${kb.mods | kb.sticky} ${[...kb.keys].slice(0, 6).join(" ")}`, true);

function renderKeyboard() {
  $("#bay").className = "bay kbd";
  $("#bay").innerHTML = `<div class="top"><span class="left"><i class="sq"></i><i class="pill"></i></span><i class="grille"></i><span class="right"><i class="pill"></i><i class="btn"></i></span></div>` +
    ROWS.map((r) => `<div class="row">${r.map((k) => {
      const off = k === "fn" || k === "123";
      const cls = ["k", ["shift","enter","ctrl","del"].includes(k) ? "wide" : "", k === "space" ? "space" : "", off ? "off" : "",
                   k.length > 1 && !["del","enter","shift","space"].includes(k) ? "small" : ""].join(" ");
      const label = k === "space" ? "" : k === "del" ? "←" : k === "enter" ? "↵" : k === "shift" ? "⇧" : k.length === 1 ? k.toUpperCase() : k;
      const legends = (SYM[k] ? `<sup>${SYM[k]}</sup>` : k === "del" ? "<sup>del</sup>" : "") +
                      (DIGIT[k] ? `<sub>${DIGIT[k]}</sub>` : ARROW[k] ? `<sub class="arrow">${ARROW[k]}</sub>` : "");
      return `<button class="${cls}" data-k="${k}" ${off ? 'title="Firmware layer key: not modelled" aria-disabled="true"' : ""}>${label}${legends}</button>`;
    }).join("")}</div>`).join("");
  $("#bay").addEventListener("pointerdown", (e) => {
    const key = e.target.closest("[data-k]"), k = key?.dataset.k;
    if (!k || k === "fn" || k === "123") return;
    if (MOD[k]) { kb.sticky ^= MOD[k]; key.classList.toggle("sticky", !!(kb.sticky & MOD[k])); sendKeys(); return; }
    kb.keys.add(USAGE[k]); sendKeys();
    const up = () => { kb.keys.delete(USAGE[k]); kb.sticky = 0; document.querySelectorAll(".k.sticky").forEach((s) => s.classList.remove("sticky")); sendKeys(); };
    key.addEventListener("pointerup", up, { once: true });
    key.addEventListener("pointerleave", up, { once: true });
  });
  $("#ext-note").textContent = "Click keys, or type: your keyboard is the extension while it's attached.";
}

// Your keyboard types through whichever extension is attached, as the Comet has no keyboard of its own.
const CODE = { Enter: 40, Escape: 41, Backspace: 42, Tab: 43, Space: 44, Minus: 45, Equal: 46, BracketLeft: 47, BracketRight: 48,
  Backslash: 49, Semicolon: 51, Quote: 52, Backquote: 53, Comma: 54, Period: 55, Slash: 56,
  ArrowRight: 79, ArrowLeft: 80, ArrowDown: 81, ArrowUp: 82 };
const CODE_MOD = { ControlLeft: 1, ShiftLeft: 2, AltLeft: 4, MetaLeft: 8, ControlRight: 16, ShiftRight: 32, AltRight: 64, MetaRight: 128 };
const usageOf = (code) => CODE[code] ?? (/^Key[A-Z]$/.test(code) ? code.charCodeAt(3) - 61 : /^Digit\d$/.test(code) ? (code[5] === "0" ? 39 : 29 + +code[5]) : /^F([1-9]|1[0-2])$/.test(code) ? 57 + +code.slice(1) : null);
const PAD_KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
const PAD_BTNS = { KeyZ: "a", KeyX: "b", KeyA: "x", KeyS: "y", KeyQ: "l", KeyW: "r", Enter: "star" };

function onKey(e, down) {
  if (e.target.closest("input, select, textarea")) return;
  if (attached === "keyboard") {
    e.preventDefault();
    if (e.repeat) return;
    if (CODE_MOD[e.code]) kb.mods = down ? kb.mods | CODE_MOD[e.code] : kb.mods & ~CODE_MOD[e.code];
    else { const u = usageOf(e.code); if (u == null) return; down ? kb.keys.add(u) : kb.keys.delete(u); }
    sendKeys();
  } else if (attached === "gamepad" && (PAD_KEYS[e.code] || PAD_BTNS[e.code])) {
    e.preventDefault();
    if (e.repeat) return;
    if (PAD_KEYS[e.code]) cmd(`dpad ${down ? PAD_KEYS[e.code] : "none"}`, true);
    else cmd(`${down ? "hold" : "release"} ${PAD_BTNS[e.code]}`, true);
  }
}
addEventListener("keydown", (e) => onKey(e, true));
addEventListener("keyup", (e) => onKey(e, false));

function renderGamepad() {
  $("#bay").className = "bay pad folder";
  $("#bay").innerHTML = `
    <div class="stick" aria-label="Analog stick"><b></b></div>
    <div class="mid"><button class="small" data-b="l" aria-label="Left small button"></button><button class="small" data-b="r" aria-label="Right small button"></button></div>
    <div class="abxy">${["y","x","b","a"].map((b) => `<button data-b="${b}">${b.toUpperCase()}</button>`).join("")}</div>
    <button class="round star" data-b="star" aria-label="Star button">✳</button>
    <div class="dpad">${["up","left","right","down"].map((d) => `<button data-d="${d}" aria-label="D-pad ${d}"></button>`).join("")}</div>
    <button class="round thumb" data-b="thumb" aria-label="Round button"></button>`;
  $("#bay").addEventListener("pointerdown", (e) => {
    const b = e.target.closest("[data-b]"), d = e.target.closest("[data-d]");
    if (!b && !d) return;
    cmd(b ? `hold ${b.dataset.b}` : `dpad ${d.dataset.d}`, true);
    const up = () => cmd(b ? `release ${b.dataset.b}` : "dpad none", true);
    e.target.addEventListener("pointerup", up, { once: true });
    e.target.addEventListener("pointerleave", up, { once: true });
  });
  const stick = $(".stick"), knob = $(".stick b");
  let last = 0;
  const move = (e) => {
    const r = stick.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2);
    const len = Math.hypot(dx, dy); if (len > 1) { dx /= len; dy /= len; }
    knob.style.transform = `translate(${dx * 20}px, ${dy * 20}px)`;
    if (Date.now() - last > 60) { last = Date.now(); cmd(`stick ${Math.round(dx * 127)} ${Math.round(dy * 127)}`, true); }
  };
  stick.addEventListener("pointerdown", (e) => { stick.setPointerCapture(e.pointerId); move(e); stick.onpointermove = move; });
  stick.addEventListener("pointerup", () => { stick.onpointermove = null; knob.style.transform = ""; cmd("stick 0 0", true); });
  $("#ext-note").textContent = "Click and drag, or use your keyboard: arrows = d-pad, Z X A S = A B X Y, Q W = small buttons, Enter = ✳.";
}

// The connector's pinout (Comet mainboard schematic, J30 + J29), as the breakout's two header rows.
const PINS = ["ADC1","5V","ADC2","USB D−","PWM3","USB D+","UART2 TX","GND","UART2 RX","CAN TX","SAI2 MCLK","CAN RX","SAI2 TXFS","GPIO1",
  "SAI2 TXC","I2C5 SCL","SAI2 TXD","I2C5 SDA","SAI2 RXD","3.3V","5V","ADC4","SYS nRST","ADC3","RTC CLKOUT","PWM4","GND","GPIO5",
  "UART1 TX","GPIO4","UART1 RX","SPI2 SS0","GPIO3","SPI2 SCLK","I2C6 SDA","SPI2 MISO","I2C6 SCL","SPI2 MOSI","3.3V","GPIO2"];
const SIMULATED = /USB|I2C6|CAN|GPIO|ADC|UART/;
async function renderBreakout() {
  $("#bay").className = "bay breakout folder";
  const odd = PINS.filter((_, i) => i % 2 === 0), even = PINS.filter((_, i) => i % 2 === 1);
  const cells = (row) => row.map((p) => `<span class="${SIMULATED.test(p) ? "sim" : ""}" title="${p}${SIMULATED.test(p) ? " (simulated)" : ""}"></span>`).join("");
  // The top-right screw sits lower, under the folder step.
  const screws = ["left:14px;top:14px", "right:14px;top:27px", "left:14px;bottom:14px", "right:14px;bottom:14px"]
    .map((at) => `<i class="screw" style="${at}"></i>`).join("");
  $("#bay").innerHTML = `<div class="slots"><i></i><i></i><i></i></div><div class="leds"><i></i><i></i><i></i></div>${screws}
    <div class="header">${cells(odd)}${cells(even)}</div>`;
  $("#ext-note").innerHTML = `The connector's pins on headers: hover one for its signal. Outlined pins are simulated: USB; I2C at <code>/dev/i2c-comet-ext</code>;
    GPIO1–5 on <code>/dev/gpiochip-comet-ext</code>; ADC1–4 as IIO; UART1/2 at <code>/dev/comet-uart1</code>, <code>2</code>; CAN as <code>can0</code>.
    Drive them with <code>mechumu ctl gpio</code> / <code>adc</code>. <span id="uart">CP2102 UART…</span>`;
  const r = await cmd("uart", true);
  const m = r.match(/at (\S+)/);
  $("#uart").innerHTML = m ? `USB-C (CP2102) UART: <code>/dev/ttyUSB0</code> in the Comet, <code>${m[1]}</code> on this computer (<code>screen ${m[1]} 115200</code>).` : r;
}

refresh();
</script>
</body>
</html>
